    <style>
        #time, #highScores {
            font-family: monospace;
        }

        input {
            font-size: inherit;
            width: 70vw;
            max-width: 400px;
            margin: 10pt;
        }

        #splashScreen {
            border: none;

        }

        #splashScreen::backdrop {
            background-color: black;
        }
    </style>
    <script src="script.js"></script>
    <script>
        const playerCards = 20, playerCount = 1
        let playerName = "", highScores = []
        addEventListener("load", setup)

        function setup() {
            reset()
            getLocalStorage()
            document.getElementById("nameInput").value = playerName
            if (highScores === null) highScores = []
            displayScores()
            document.getElementById("startButton").addEventListener("click", startGame)
            document.getElementById("splashScreen").showModal()
        }

        function startGame() {
            //Set the player name
            playerName = document.getElementById("nameInput").value
            // Close the splash screen
            document.getElementById("splashScreen").close()
            // Start the timer
            startTimer(document.getElementById("time"))
        }

        function displayScores() { //Reads the list of highScores and displays them in order
            const scoreContainer = document.getElementById("highScores")
            if (highScores.length=== 0) return
            highScores.sort((a, b) => a.time - b.time)
            highScores.forEach((score, index) => {
                // Only display 5 scores
                if (index>4) return
                // Set the symbol
                let scoreSymbol = "▫️"
                switch (index) {
                    case 0:
                        scoreSymbol = "🥇"
                        break
                    case 1:
                        scoreSymbol = "🥈"
                        break
                    case 2:
                        scoreSymbol = "🥉"
                        break
                }
                //Create div
                let scoreDiv = document.createElement("div")
                scoreDiv.textContent += `${scoreSymbol}${convertTime(score.time)} ${score.name}`
                scoreContainer.appendChild(scoreDiv)
            })
        }
    </script>
</head>
