<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!--    <link rel="apple-touch-icon" href="icon.png">-->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jokkle">
    <title>Jokkle</title>
    <style>
        :root {
            color-scheme: light dark;
            font-size: max(10pt, min(4vh, 4vw));
            font-family: sans-serif;
        }

        body {
            touch-action: manipulation;
            -webkit-touch-callout: none; /* iOS Safari */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Old versions of Firefox */
            -ms-user-select: none; /* Internet Explorer/Edge */
            user-select: none;

            position: fixed;
            display: grid;
            /*grid-template-rows: 20dvh 80dvh;*/
            align-items: center;
            justify-items: center;
            height: 100dvh;
            width: 100dvw;
            margin: 0;
        }
        .circle {
            --radius: 150px;
            border: 2pt solid black;
            border-radius: 50%;

            position: relative;
            width: 400px;
            aspect-ratio: 1;
        }

        .itemSlot {
            --i: 0;

            position: absolute;
            top: 50%;
            left: 50%;

            width: 60px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2pt solid black;
            display: grid;
            align-items: center;
            justify-items: center;

            transform:
                    translate(-50%, -50%)
                    rotate(calc(var(--i) * 360deg / 7))
                    translateY(calc(-1 * var(--radius)));
        }

        .itemSlot:nth-child(1) { --i: 0; }
        .itemSlot:nth-child(2) { --i: 1; }
        .itemSlot:nth-child(3) { --i: 2; }
        .itemSlot:nth-child(4) { --i: 3; }
        .itemSlot:nth-child(5) { --i: 4; }
        .itemSlot:nth-child(6) { --i: 5; }
        .itemSlot:nth-child(7) { --i: 6; }

        .centerSlot {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /*#cardTest {*/
        /*    border-radius: 50%;*/
        /*    border: 2pt solid black;*/

        /*    height: 500px;*/
        /*    width: 500px;*/
        /*}*/
        /*#cardTest > div {*/
        /*    position: absolute;*/
        /*    */
        /*}*/
    </style>
</head>
<body>
<div id="cardTest" class="circle">
    <div class="itemSlot"><div class="item">🌸</div></div>
    <div class="itemSlot"><div class="item">🦀</div></div>
    <div class="itemSlot"><div class="item">🌻</div></div>
    <div class="itemSlot"><div class="item">🍀</div></div>
    <div class="itemSlot"><div class="item">🐟</div></div>
    <div class="itemSlot"><div class="item">🦈</div></div>
    <div class="itemSlot"><div class="item">🐁</div></div>
    <div class="itemSlot centerSlot"><div class="item">🐊</div></div>
</div>
</body>
</html>
